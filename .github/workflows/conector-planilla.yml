name: Conector de planilla

# Corre solo cada 5 minutos, o manualmente desde la pestaña Actions
# ("Run workflow") para probar sin esperar al cron.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Si una corrida tarda más de 5 minutos, evita que se solape con la
# siguiente (facturaría filas dos veces o pisaría el commit de estado).
concurrency:
  group: conector-planilla
  cancel-in-progress: false

permissions:
  contents: write # necesario para el commit + push del estado al final

env:
  CUIT_NEGOCIO: "20448884148"
  PLANILLA_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQu4xs3O5VnDZBkkqTmnpBRRC8GaqsAOosKBWpZDF4HRLerBvZmBmraWHF4GHy1WR2jvWaoGI5k4waY/pub?gid=0&single=true&output=csv"
  SPREADSHEET_ID: "1Z5RfcvaANBHgwb9k7ritEsqVTG9jIDu-1wQTaByofSY"

jobs:
  facturar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Reconstruir credenciales desde Secrets
        run: |
          mkdir -p "negocios/${CUIT_NEGOCIO}/certs"
          printf '%s' "$ARCA_CERT" > "negocios/${CUIT_NEGOCIO}/certs/certificado.crt"
          printf '%s' "$ARCA_KEY" > "negocios/${CUIT_NEGOCIO}/certs/certificado.key"
          printf '%s' "$GOOGLE_SHEETS_CREDENTIALS" > credenciales-google-sheets.json
        env:
          ARCA_CERT: ${{ secrets.ARCA_CERT }}
          ARCA_KEY: ${{ secrets.ARCA_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}

      - name: Renovar token WSAA
        # El runner arranca sin memoria de la corrida anterior, así que
        # no hay token_wsfe.json guardado — pedimos uno nuevo siempre.
        # No lo persistimos en el repo a propósito: es un token de
        # acceso válido por 12hs, y el repo es público.
        run: node wsaa.js --cuit "$CUIT_NEGOCIO" --servicio wsfe

      - name: Correr el conector de planilla
        run: >
          node conectores/planilla.js
          --cuit "$CUIT_NEGOCIO"
          --url "$PLANILLA_URL"
          --spreadsheetId "$SPREADSHEET_ID"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Guardar el estado actualizado (commit + push)
        run: |
          git config user.name "conector-planilla-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "negocios/${CUIT_NEGOCIO}/planilla_procesadas.json" \
                   "negocios/${CUIT_NEGOCIO}/clientes.json" \
                   "negocios/${CUIT_NEGOCIO}/ultima_factura.json"
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza estado del conector [skip ci]"
            git push
          else
            echo "Sin cambios de estado en esta corrida."
          fi
